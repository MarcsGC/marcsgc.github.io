<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gráficalo</title>
<meta name="description" content="Crea gráficos y calcula estadísticas desde el móvil.">
<meta name="theme-color" content="#0e6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: papel milimetrado; móvil = una vista a la vez con barra inferior, escritorio = datos | gráfico + estadísticas */
:root{
  --paper:#f4f7f5; --sheet:#ffffff; --grid:#e1e9e5; --ink:#17231f; --muted:#5b6b65;
  --accent:#0e6b5c; --accent-soft:#d6ece6; --amber:#c47a12; --danger:#b3392f; --line:#cfdad5; --formula:#f1f5f3;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1513; --sheet:#161e1b; --grid:#1d2824; --ink:#e3ece8; --muted:#93a59e;
  --accent:#4cc3aa; --accent-soft:#183a33; --amber:#e8a646; --danger:#ef7a6f; --line:#2a3833; --formula:#1a2421; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1513; --sheet:#161e1b; --grid:#1d2824; --ink:#e3ece8; --muted:#93a59e;
  --accent:#4cc3aa; --accent-soft:#183a33; --amber:#e8a646; --danger:#ef7a6f; --line:#2a3833; --formula:#1a2421; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;flex-direction:column;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 96px;max-width:1320px;margin:0 auto}
header.top{display:flex;align-items:center;gap:10px;padding-block:4px 14px}
.brand{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-shrink:0}
.brand svg{width:28px;height:28px}
.brand span{display:none}
@media (min-width:520px){.brand span{display:inline}}
.project{display:flex;gap:6px;align-items:center;margin-left:auto;min-width:0;flex:1;justify-content:flex-end}
.project select{min-width:0;flex:1;max-width:340px}

select,input[type=text],input[type=number],textarea{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);padding:3px}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.icon{padding:8px;width:38px;justify-content:center;flex-shrink:0}
.btn.small{padding:5px 10px;font-size:.85rem}

main.views{display:grid;gap:16px;flex:1}
@media (min-width:1000px){
  main.views{grid-template-columns:minmax(340px,1fr) minmax(0,1.45fr);grid-template-areas:"data chart" "data stats";align-items:start}
  #view-data{grid-area:data;position:sticky;top:12px}#view-chart{grid-area:chart}#view-stats{grid-area:stats}
  nav.tabs{display:none!important}
  .app{padding-bottom:24px}
  .view[hidden]{display:flex!important}
}
.view{background:var(--sheet);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.view h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0;letter-spacing:-.01em}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.vhead .grp{display:flex;gap:6px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.86rem;margin:0}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

/* tabla de datos */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:min(62vh,640px)}
table.data{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
table.data th{position:sticky;top:0;z-index:1;background:var(--paper);border-bottom:1px solid var(--line);padding:0;text-align:left;font-weight:600}
table.data td{border-bottom:1px solid var(--grid);padding:0;background:var(--sheet)}
table.data .num-col{width:30px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:.72rem;padding:0 4px}
table.data input{width:100%;min-width:84px;border:0;border-radius:0;background:transparent;padding:9px 8px}
table.data input.num{font-family:var(--mono);text-align:right}
table.data input:focus{background:var(--accent-soft);outline:none}
table.data td.calc{background:var(--formula);font-family:var(--mono);text-align:right;padding:9px 8px;color:var(--muted);min-width:84px;white-space:nowrap}
table.data td.calc.err{color:var(--danger)}
.colhead{display:flex;flex-direction:column;align-items:stretch;gap:1px;border:0;background:none;padding:6px 8px;width:100%;text-align:left;min-width:84px}
.colhead .l{font-family:var(--mono);font-size:.68rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.colhead .l i{width:8px;height:8px;border-radius:2px;display:inline-block}
.colhead .n{font-size:.82rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.colhead:hover .n{color:var(--accent)}
.labelhead{padding:6px 8px}
.labelhead input{border:0;background:transparent;padding:0;font-weight:600;font-size:.82rem;width:100%;min-width:84px}
.labelhead .l{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.addcol{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 10px;white-space:nowrap}
table.data .del{border:0;background:none;color:var(--muted);padding:6px 8px;font-size:1.1rem}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}

/* gráfico */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:.86rem;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.chips svg{width:16px;height:16px}
.chips.series button i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chips.series button[aria-pressed=false]{color:var(--muted)}
.chips.series button[aria-pressed=false] i{opacity:.35}
.chips.series button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chartbox{position:relative;height:min(58vh,440px);min-height:280px}
.opts{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;font-size:.88rem;color:var(--muted)}
.opts label{display:inline-flex;gap:6px;align-items:center}
.opts select,.opts input[type=number]{padding:5px 8px}
.opts input[type=number]{width:70px}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:24px}

/* estadísticas */
.sblock{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.sblock:first-of-type{border-top:0;padding-top:0}
.sblock h3{margin:0;font-family:var(--display);font-weight:600;font-size:1rem}
.sel-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.88rem;color:var(--muted)}
.sel-row label{display:inline-flex;gap:6px;align-items:center}
.sel-row select{padding:6px 8px;max-width:100%}
dl.stats{margin:0;display:grid;grid-template-columns:1fr auto;font-variant-numeric:tabular-nums;column-gap:12px}
@media (min-width:640px){dl.stats.two{grid-template-columns:1fr auto 1fr auto;column-gap:20px}}
dl.stats dt,dl.stats dd{padding:6px 0;border-bottom:1px dashed var(--line);margin:0}
dl.stats dt{color:var(--muted);font-size:.9rem;display:flex;align-items:center;gap:4px}
dl.stats dd{font-family:var(--mono);text-align:right;font-weight:500}
.info{border:0;background:none;color:var(--muted);padding:0 2px;font-size:.8rem;line-height:1}
.explain{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.88rem;margin:0}
.badge{font-family:var(--mono);font-size:.75rem;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.warn{color:var(--amber)}
.eq{font-family:var(--mono);font-size:1rem;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
.predict{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.92rem}
.predict input{width:110px;font-family:var(--mono)}
.predict output{font-family:var(--mono);font-weight:600;color:var(--accent)}
.ftable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.freq{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.88rem}
table.freq th{background:var(--paper);color:var(--muted);font-weight:600;font-size:.74rem;text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.freq th:first-child,table.freq td:first-child{text-align:left}
table.freq td{padding:6px 10px;border-bottom:1px solid var(--grid);text-align:right;font-family:var(--mono);white-space:nowrap}
table.freq tfoot td{font-weight:600;border-top:1px solid var(--line)}
table.freq .bar{display:inline-block;height:8px;background:var(--accent);border-radius:2px;vertical-align:middle;margin-left:6px;opacity:.7}

/* navegación inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);display:flex;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted);padding:6px 0;border-radius:8px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected=true]{color:var(--accent);background:var(--accent-soft)}

/* hojas modales */
.sheet{position:fixed;inset:0;background:rgba(10,20,17,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .card{background:var(--sheet);width:100%;max-width:580px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
@media (min-width:640px){.sheet{align-items:center}.sheet .card{border-radius:16px}}
.sheet h3{margin:0;font-family:var(--display);font-weight:600;font-size:1.15rem}
.sheet textarea{min-height:150px;font-family:var(--mono);font-size:.85rem;width:100%}
.sheet input[type=text]{width:100%}
.sheet img{border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet .field{display:flex;flex-direction:column;gap:5px}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .err{color:var(--danger);font-size:.86rem;margin:0}
.sheet .ok{color:var(--accent);font-size:.86rem;margin:0;font-family:var(--mono)}
.examples{display:flex;flex-wrap:wrap;gap:6px}
.examples button{font-family:var(--mono);font-size:.8rem;border:1px dashed var(--line);background:var(--paper);border-radius:6px;padding:4px 8px}
details.help summary{cursor:pointer;color:var(--accent);font-size:.88rem}
details.help ul{margin:8px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
details.help code{font-family:var(--mono);color:var(--ink)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tpls button{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.tpls button:hover{border-color:var(--accent)}
.tpls b{font-weight:600}
.tpls small{color:var(--muted);font-size:.8rem;line-height:1.3}
.colorlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.colorlist label{display:flex;align-items:center;gap:8px;font-size:.88rem;min-width:0}
.colorlist label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:6px 12px;font-size:.88rem}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
.preview{overflow:auto;max-height:180px;border:1px solid var(--line);border-radius:8px;font-size:.8rem}
.preview table{border-collapse:collapse}
.preview td{padding:4px 8px;border-bottom:1px solid var(--grid);white-space:nowrap;font-family:var(--mono)}
.preview tr:first-child td{font-weight:600;background:var(--paper)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (min-width:1000px){.toast{bottom:24px}}
@media (prefers-reduced-motion:no-preference){.sheet .card{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="var(--accent)"/><rect x="8" y="17" width="4" height="8" rx="1" fill="var(--sheet)"/><rect x="14" y="11" width="4" height="14" rx="1" fill="var(--sheet)"/><rect x="20" y="7" width="4" height="18" rx="1" fill="var(--amber)"/></svg>
      <span>Gráficalo</span>
    </div>
    <div class="project">
      <select id="projectSel" aria-label="Proyecto"></select>
      <button class="btn icon" id="newProject" title="Nuevo proyecto" aria-label="Nuevo proyecto">＋</button>
      <button class="btn icon" id="projectMenu" title="Opciones del proyecto" aria-label="Opciones del proyecto">⋯</button>
    </div>
  </header>

  <main class="views">
    <section class="view" id="view-data">
      <div class="vhead"><h2>Datos</h2><span class="badge" id="rowCount">0 filas</span></div>
      <div class="tablewrap" id="tablewrap">
        <table class="data"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
      </div>
      <div class="row-actions">
        <button class="btn primary" id="addRow">＋ Fila</button>
        <button class="btn" id="addCol">＋ Columna</button>
        <button class="btn" id="pasteBtn">Pegar</button>
        <label class="btn" for="fileIn">Importar<input type="file" id="fileIn" accept=".csv,.txt,.tsv,.xlsx,.xls,.ods,text/csv" hidden></label>
      </div>
      <p class="hint">Toca el nombre de una columna para cambiarlo, darle un color o convertirla en una fórmula. Decimales con coma o con punto.</p>
    </section>

    <section class="view" id="view-chart" hidden>
      <div class="vhead"><h2 id="chartTitle">Gráfico</h2>
        <div class="grp"><button class="btn small" id="customBtn">Personalizar</button><button class="btn small" id="exportBtn">Guardar imagen</button></div></div>
      <div class="chips" role="group" aria-label="Tipo de gráfico" id="types"></div>
      <div id="seriesRow"><div class="label" style="margin-bottom:6px">Series</div><div class="chips series" id="seriesChips"></div></div>
      <div class="sel-row" id="xyRow" hidden>
        <label>X <select id="chartX"></select></label>
        <label>Y <select id="chartY"></select></label>
        <label>Ajuste <select id="chartModel"></select></label>
      </div>
      <div class="chartbox"><canvas id="chart" role="img" aria-label="Gráfico de los datos"></canvas><div class="empty" id="chartEmpty" hidden></div></div>
      <div class="opts" id="opts">
        <label id="optMeanW"><input type="checkbox" id="optMean"> Línea de la media</label>
        <label id="optValuesW"><input type="checkbox" id="optValues"> Mostrar valores</label>
        <label id="binsWrap" hidden>Intervalos <input type="number" id="optBins" min="2" max="40" placeholder="auto"></label>
      </div>
    </section>

    <section class="view" id="view-stats" hidden>
      <div class="vhead"><h2>Estadísticas</h2><button class="btn small" id="copyStats">Copiar todo</button></div>
      <p class="explain" id="explain" hidden></p>

      <div class="sblock">
        <div class="vhead"><h3>Resumen</h3><div class="sel-row"><label>Serie <select id="sumCol"></select></label></div></div>
        <div id="summary"></div>
      </div>

      <div class="sblock">
        <div class="vhead"><h3>Tabla de frecuencias</h3>
          <div class="sel-row"><label>Serie <select id="freqCol"></select></label><label>Intervalos <input type="number" id="freqBins" min="2" max="40" placeholder="auto" style="width:72px;padding:6px 8px"></label><button class="btn small" id="copyFreq">Copiar</button></div></div>
        <div id="freq"></div>
      </div>

      <div class="sblock">
        <div class="vhead"><h3>Relación entre dos series</h3><button class="btn small" id="toScatter">Ver en el gráfico</button></div>
        <div class="sel-row">
          <label>X <select id="regX"></select></label>
          <label>Y <select id="regY"></select></label>
          <label>Modelo <select id="regModel"></select></label>
        </div>
        <div id="reg"></div>
      </div>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="view-data" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>Datos</button>
    <button role="tab" data-view="view-chart" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Gráfico</button>
    <button role="tab" data-view="view-stats" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h14M7 4l5 8-5 8h12"/></svg>Estadísticas</button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden><div class="card" id="sheetCard" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="chart.umd.js"></script>
<script src="stats.js"></script>
<script src="app.js"></script>

</body>
</html>
