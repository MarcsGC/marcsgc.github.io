<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apps de marcsgc</title>
<meta name="description" content="Gráficalo y Formidex: apps sencillas y gratuitas para el móvil.">
<meta name="theme-color" content="#f4f7f5">
<link rel="icon" href="/graficalo/icons/icon-192.png">
<script>
/* Gráficalo vivía aquí, en la raíz. Lo que venga de la app antigua sigue a /graficalo/:
   - la app instalada (pantalla completa) o la app de Android, que abre la raíz
   - los enlaces compartidos (#p=…) y el atajo «Registro rápido» (#quick)
   - la vuelta del inicio de sesión de Google Drive, si Gráficalo lo había empezado */
(function () {
  var l = location, h = l.hash, q = l.search;
  var mm = function (m) { try { return matchMedia("(display-mode: " + m + ")").matches; } catch (e) { return false; } };
  var installed = mm("standalone") || mm("fullscreen") || mm("minimal-ui") || navigator.standalone === true;
  var android = document.referrer.indexOf("android-app://") === 0;
  var gfxLink = /^#(p=|quick$)/.test(h);
  var gfxLogin = false;
  try { gfxLogin = /(^#|&)(access_token|error)=/.test(h) && !!localStorage.getItem("graficalo.gdstate"); } catch (e) {}
  if (installed || android || gfxLink || gfxLogin) l.replace("/graficalo/" + q + h);
})();
</script>
<style>
:root{--paper:#f4f7f5;--sheet:#fff;--grid:#e1e9e5;--ink:#17231f;--muted:#5b6b65;--line:#cfdad5;--accent:#0e6b5c}
@media (prefers-color-scheme:dark){:root{--paper:#0f1513;--sheet:#161e1b;--grid:#1d2824;--ink:#e3ece8;--muted:#93a59e;--line:#2a3833;--accent:#4cc3aa;color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
main{max-width:720px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-left)) 40px}
h1{margin:0 0 6px;font-size:clamp(2rem,8vw,2.8rem);line-height:1.05;letter-spacing:-.02em}
.sub{margin:0 0 28px;color:var(--muted)}
.apps{display:grid;gap:12px}
.app{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--sheet);color:inherit;text-decoration:none;box-shadow:0 1px 0 var(--line)}
.app:hover{border-color:var(--accent)}
.app:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app img{width:64px;height:64px;border-radius:14px;display:block}
.app b{display:block;font-size:1.2rem}
.app span{display:block;color:var(--muted);font-size:.95rem}
.app i{font-style:normal;color:var(--accent);font-size:1.4rem}
footer{margin-top:32px;color:var(--muted);font-size:.85rem}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1 data-es="Mis apps" data-en="My apps">Mis apps</h1>
  <p class="sub" data-es="Herramientas sencillas y gratuitas para el móvil y el ordenador." data-en="Simple, free tools for your phone and computer.">Herramientas sencillas y gratuitas para el móvil y el ordenador.</p>
  <div class="apps">
    <a class="app" href="/graficalo/">
      <img src="/graficalo/icons/icon-192.png" alt="">
      <div><b>Gráficalo</b><span data-es="Gráficos y estadísticas: apunta tus datos y míralos crecer." data-en="Charts and statistics: log your data and watch it grow.">Gráficos y estadísticas: apunta tus datos y míralos crecer.</span></div>
      <i aria-hidden="true">→</i>
    </a>
    <a class="app" href="/formidex/">
      <img src="/formidex/pwa-192x192.png" alt="">
      <div><b>Formidex</b><span data-es="Registro de hormigas en el mapa y fichas de cría." data-en="Ant records on the map and breeding sheets.">Registro de hormigas en el mapa y fichas de cría.</span></div>
      <i aria-hidden="true">→</i>
    </a>
  </div>
  <footer>
    <a href="https://play.google.com/store/apps/details?id=io.github.marcsgc.twa" data-es="Gráficalo en Google Play" data-en="Gráficalo on Google Play">Gráficalo en Google Play</a> ·
    <a href="/graficalo/privacidad.html" data-es="Privacidad de Gráficalo" data-en="Gráficalo privacy">Privacidad de Gráficalo</a>
  </footer>
</main>
<script>
if (!/^(es|ca|gl|eu)\b/i.test(navigator.language || "es")) {
  document.documentElement.lang = "en";
  document.querySelectorAll("[data-en]").forEach(function (e) { e.textContent = e.getAttribute("data-en"); });
}
// Retira el service worker antiguo de Gráficalo que quedó registrado en la raíz (sw.js solo se desregistra).
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistration("/").then(function (r) { if (r && new URL(r.scope).pathname === "/") r.update().catch(function () {}); }).catch(function () {});
}
</script>
</body>
</html>
